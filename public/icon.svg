<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle for crisp favicon display across browser tabs -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5"/>
  
  <!-- Subtle book spine shadow -->
  <path d="M32 18 L32 48" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left book page -->
  <path d="M32 20 C24 16 16 17 12 19 C11.4 19.3 11 19.9 11 20.6 L11 43.5 C11 44.4 11.8 45.1 12.7 44.9 C16.5 43.5 24 43 32 46 Z" 
        fill="url(#pageGradLeft)" opacity="0.95"/>
        
  <!-- Right book page -->
  <path d="M32 20 C40 16 48 17 52 19 C52.6 19.3 53 19.9 53 20.6 L53 43.5 C53 44.4 52.2 45.1 51.3 44.9 C47.5 43.5 40 43 32 46 Z" 
        fill="url(#pageGradRight)"/>

  <!-- Page text lines hints -->
  <path d="M16 26 C21 24.5 26 25 28 26 M16 31 C21 29.5 26 30 28 31 M16 36 C21 34.5 26 35 28 36" 
        stroke="#64748b" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M36 26 C38 25 43 24.5 48 26 M36 31 C38 30 43 29.5 48 31 M36 36 C38 35 43 34.5 48 36" 
        stroke="#64748b" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Glowing Bookmark ribbon -->
  <path d="M30 18 L30 35 L33.5 32 L37 35 L37 18 Z" fill="url(#accentGrad)"/>

  <!-- Small sparkling magical star in corner representing novel discovery / search -->
  <path d="M47 13 L48.2 16.2 L51.5 17.5 L48.2 18.8 L47 22 L45.8 18.8 L42.5 17.5 L45.8 16.2 Z" 
        fill="#f472b6" opacity="0.95"/>
</svg>
